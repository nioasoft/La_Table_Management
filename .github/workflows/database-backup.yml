name: Daily Database Backup

on:
  schedule:
    # 00:00 UTC = 02:00 Israel winter / 03:00 Israel summer
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

env:
  # Opt in to Node.js 24 runtime for actions to silence the Node 20 deprecation
  # warning. Node 20 is scheduled for removal from runners on 2026-09-16.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  backup:
    name: Dump and upload Postgres backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Postgres 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      - name: Install backup dependencies
        run: npm install --no-save --no-audit --no-fund --omit=dev @vercel/blob@^2.0.0 resend@^6.7.0 tsx@^4.21.0

      - name: Generate backup metadata
        run: |
          BACKUP_DATE=$(date -u +%Y-%m-%d)
          DUMP_FILE="backup-${BACKUP_DATE}.dump"
          echo "BACKUP_DATE=${BACKUP_DATE}" >> $GITHUB_ENV
          echo "DUMP_FILE=${DUMP_FILE}" >> $GITHUB_ENV

      - name: Validate required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          BACKUP_NOTIFICATION_TO: ${{ secrets.BACKUP_NOTIFICATION_TO }}
        run: |
          set -e
          missing=()
          [ -z "$DATABASE_URL" ] && missing+=("DATABASE_URL")
          [ -z "$BLOB_READ_WRITE_TOKEN" ] && missing+=("BLOB_READ_WRITE_TOKEN")
          [ -z "$RESEND_API_KEY" ] && missing+=("RESEND_API_KEY")
          [ -z "$EMAIL_FROM" ] && missing+=("EMAIL_FROM")
          [ -z "$BACKUP_NOTIFICATION_TO" ] && missing+=("BACKUP_NOTIFICATION_TO")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "ERROR: missing required secrets: ${missing[*]}"
            exit 1
          fi
          echo "All required secrets are set."
          echo "DATABASE_URL length: ${#DATABASE_URL}"
          echo "DATABASE_URL prefix: ${DATABASE_URL:0:15}..."

      - name: Run pg_dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pg_dump "$DATABASE_URL" \
            --format=custom \
            --compress=9 \
            --no-owner \
            --no-privileges \
            --file="$DUMP_FILE"
          ls -lh "$DUMP_FILE"

      - name: Upload backup and notify
        env:
          DUMP_FILE: ${{ env.DUMP_FILE }}
          BACKUP_DATE: ${{ env.BACKUP_DATE }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
          BACKUP_NOTIFICATION_TO: ${{ secrets.BACKUP_NOTIFICATION_TO }}
          BACKUP_NOTIFICATION_CC: ${{ secrets.BACKUP_NOTIFICATION_CC }}
          BACKUP_RETENTION_DAYS: ${{ secrets.BACKUP_RETENTION_DAYS }}
        run: npm run backup:run

      - name: Upload dump as artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-backup-${{ env.BACKUP_DATE }}
          path: ${{ env.DUMP_FILE }}
          retention-days: 7
          if-no-files-found: ignore
